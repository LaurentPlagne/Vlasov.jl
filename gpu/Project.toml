# Environnement du travail GPU : Vlasov plus un backend.
#
# `Metal` est une dépendance **faible** du paquet — le chemin CPU doit rester
# utilisable sur une machine sans GPU Apple. Charger l'extension demande donc
# un environnement qui la porte, et c'est celui-ci :
#
#     julia --project=gpu -t auto scripts/bench_gpu.jl
[deps]
Metal = "dde4c033-4e86-420c-a63e-0dd931031962"
Vlasov = "2b4e4dc6-bb65-44a8-9970-a8d90b7ff1a4"
